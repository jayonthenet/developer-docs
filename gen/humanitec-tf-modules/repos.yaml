# Classifies each public repo in the humanitec-tf-modules GitHub org.
# Every repo (except those on the ignore list, see the script) must appear in exactly one section.

orchestrator-configuration:
  - common-resource-types
  - kubernetes-agent-orchestrator-runner
  - serverless-ecs-orchestrator-runner

module-source:
  - k8s-namespace-kubernetes
  - k8s-role-kubernetes
  - k8s-service-account-kubernetes
  - k8s-workload-kubernetes
  - route-kubernetes-http-route
  - score-cronjob-kubernetes
  - score-workload-kubernetes
  - serverless-lambda

ignore:
  - .github
  - reusable-workflows
