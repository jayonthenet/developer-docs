baseurl = "/"
canonifyURLs = false
disableAliases = false
disableHugoGeneratorInject = true
enableEmoji = true
enableGitInfo = false
enableRobotsTXT = true
rssLimit = 10
timeout = "60s"

ignoreFiles = ['data/errorcodes/_README.md']

[pagination]
pagerSize = 7

# add redirects/headers
[outputs]
home = ["HTML", "RSS", "REDIRECTS", "HEADERS"]
section = ["HTML", "RSS", "SITEMAP"]

# remove .{ext} from text/netlify
[mediaTypes."text/netlify"]
suffixes = [""]
delimiter = ""

# add output format for netlify _redirects
[outputFormats.REDIRECTS]
mediaType = "text/netlify"
baseName = "_redirects"
isPlainText = true
notAlternative = true

# add output format for netlify _headers
[outputFormats.HEADERS]
mediaType = "text/netlify"
baseName = "_headers"
isPlainText = true
notAlternative = true

# add output format for section sitemap.xml
[outputFormats.SITEMAP]
mediaType = "application/xml"
baseName = "sitemap"
isHTML = false
isPlainText = true
noUgly = true
rel = "sitemap"

[caches]
[caches.getjson]
dir = ":cacheDir/:project"
maxAge = "10s"

[sitemap]
changefreq = "weekly"
filename = "sitemap.xml"
priority = 0.5

[taxonomies]
contributor = "contributors"
category = "categories"
tag = "tags"

[permalinks]
platform-orchestrator = "/:sections[0:]/:title/"

[minify.tdewolff.html]
keepWhitespace = false

[related]
threshold = 80
includeNewer = true
toLower = false
[[related.indices]]
name = "categories"
weight = 100
[[related.indices]]
name = "tags"
weight = 80
[[related.indices]]
name = "date"
weight = 10

[module]
[module.hugoVersion]
extended = true
min = "0.80.0"
max = ""
[[module.mounts]]
source = "assets"
target = "assets"
[[module.mounts]]
source = "static"
target = "static"
[[module.mounts]]
source = "layouts"
target = "layouts"
[[module.mounts]]
source = "node_modules/flexsearch"
target = "assets/js/vendor/flexsearch"
[[module.mounts]]
source = "node_modules/katex"
target = "assets/js/vendor/katex"
[[module.mounts]]
source = "node_modules/mermaid"
target = "assets/js/vendor/mermaid"
[[module.mounts]]
source = "node_modules/@hyas/images/layouts"
target = "layouts"

[Params]
octlVersion = "1.0.0"
canyonRunnerImageVersion = "1.11.0"
scoreHumanitecVersion = "0.10.2"
GitHubBaseUrl = "https://github.com"
GitHubRawBaseUrl = "https://raw.githubusercontent.com"
KapaMCPknowledgeV2Url = "https://humanitec-orchestrator-v2.mcp.kapa.ai"
[[Params.exampleFileTypes]]
name = "yaml"
label = "YAML"
[[Params.exampleFileTypes]]
name = "tf"
label = "Terraform"
[[Params.exampleTypeLabels]]
name = "score"
labels = ["Capability"]
[[Params.exampleTypeLabels]]
name = "resource-definitions"
labels = ["Driver", "Capability", "Flavor"]
[[Params.exampleTypeLabels]]
name = "pipelines"
labels = ["Kind", "Capability"]
[[Params.exampleTypeLabels]]
name = "resource-packs"
labels = ["Cloud", "Example", "Flavor"]
[[Params.exampleTypeLabels]]
name = "resource-graph-patterns"
labels = ["Pattern name"]
[[Params.exampleLibraryGitHubUrls]]
name = "resource-packs/aws"
url = "https://github.com/humanitec-architecture/resource-packs-aws/blob/main/examples"
[[Params.exampleLibraryGitHubUrls]]
