description = "Humanitec powers your enterprise-grade Internal Developer Platform. Our products let platform teams remove bottlenecks by letting them build golden paths for developers."
baseURL = "https://staging-developer.humanitec.com"
alert = false
alertText = ""

## Documentation
# docsVersion = "0.3"

## Open Graph
images = ["stellwerk-lockup-horizontal.svg"]
ogLocale = "en_US"
domainTLD = "not.used"
titleHome = "Developer Docs"

## Twitter Cards
twitterSite = "@NOT_USED"
twitterCreator = "@NOT_USED"

## JSON-LD
# schemaType = "Person"
schemaType = "Organization"
