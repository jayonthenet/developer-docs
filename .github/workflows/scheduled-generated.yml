name: Update generated content
on:
  # uncomment to activate scheduled runs
  # schedule:
  #  - cron: "0 10 * * 1-5"
  workflow_dispatch:
  # push: # uncomment to test this workflow
jobs:
  update:
    if: github.repository == 'stellwerk-labs/developer-docs'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Prepare GitHub bot
        run: |
          # Set github actions bot as the committer, see https://github.com/actions/checkout/pull/1184
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
      - name: Re-generate generated content
        run: npm run gen-all
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.0
        with:
          token: ${{ secrets.GH_PAT }}
          commit-message: "chore: update generated content"
          title: Update generated content
          body: |
            Update generated content.
          branch: update-generated
          # To add a GitHub team named "Docs" as PR reviewers, uncomment the line below
          # team-reviewers: "Docs"
