name: Update generated content
on:
  # uncomment to activate scheduled runs
  # schedule:
  #  - cron: "0 10 * * 1-5"
  workflow_dispatch:
  # push: # uncomment to test this workflow
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Prepare GitHub bot
        run: |
          # Set github actions bot as the committer, see https://github.com/actions/checkout/pull/1184
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
      - name: Re-generate generated content
        run: npm run gen-all
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GH_PAT }}
          commit-message: "chore: update generated content"
          title: Update generated content
          body: |
            Update generated content.
          branch: update-generated
          # To add a GitHub team named "Docs" as PR reviewers, uncomment the line below
          # team-reviewers: "Docs"
