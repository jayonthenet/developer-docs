<footer class="footer text-muted">
  <div
    class="container-{{ if .Site.Params.options.fullWidth }}fluid{{ else }}xxl{{ end }}"
  >
    <div class="footer-top">
      <div class="footer-brand">
        <a href="{{ "/" | relLangURL }}" class="footer-logo">
          <img
            src="/stellwerk-lockup-horizontal-on-dark.svg"
            alt="Stellwerk Labs"
          />
        </a>
        <p>Sovereign Platform Orchestration · Open source · Engineered in Europe.</p>
      </div>
      {{ if .Site.Menus.footer }}
        <nav class="footer-links" aria-label="Footer">
          {{ range .Site.Menus.footer -}}
            <a href="{{ .URL | relURL }}">{{ .Name }}</a>
          {{ end -}}
        </nav>
      {{ end }}
    </div>
    <div class="footer-legal">
      <span>© 2026 Stellwerk Labs GmbH · Ratingen, Germany</span>
      <span>Stellwerk Labs Switch · SLS · stellwerk.dev</span>
    </div>
  </div>
</footer>
