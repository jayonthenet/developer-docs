{{ if or .Prev .Next -}}
<div class="docs-navigation d-flex justify-content-between">
  <!-- https://www.feliciano.tech/blog/custom-sort-hugo-single-pages/ -->
  {{ $pages := where site.RegularPages "Section" .Section -}} {{ with
  .NextInSection }}
  <a href="{{ .RelPermalink }}">
    <div class="card my-1">
      <div class="card-body py-2 docs-nav-prev"><p>{{ .Title }}</p></div>
    </div>
  </a>
  {{ end -}} {{ with .PrevInSection }}
  <a class="ms-auto" href="{{ .RelPermalink }}">
    <div class="card my-1">
      <div class="card-body py-2 docs-nav-next"><p>{{ .Title }}</p></div>
    </div>
  </a>
  {{ end -}}
</div>
{{ end -}}
